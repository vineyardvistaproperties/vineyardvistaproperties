<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Vineyard Vista Properties | Sign In</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Libre+Franklin:wght@300;400;500;600&display=swap" rel="stylesheet"><style>:root{--navy:#0D2340;--sand:#B89C7A;--ivory:#F7F5F0;--ink:#263342;--muted:#66717f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--navy);font-family:"Libre Franklin",Arial,sans-serif;color:var(--ink);padding:24px}.card{width:min(500px,100%);background:var(--ivory);padding:42px;border-top:4px solid var(--sand)}.kicker{text-transform:uppercase;letter-spacing:.16em;font-size:.7rem;font-weight:600;color:var(--sand)}h1{font:500 3rem/1 "Cormorant Garamond",Georgia,serif;color:var(--navy);margin:.5rem 0 1rem}p{color:var(--muted);font-size:.92rem}label{display:block;text-transform:uppercase;letter-spacing:.09em;font-size:.72rem;font-weight:600;margin:1.4rem 0 .5rem}input{width:100%;padding:13px 14px;border:1px solid #c9c1b6;background:#fff;font:inherit}button{width:100%;margin-top:18px;padding:14px;border:0;background:var(--navy);color:#fff;font-weight:600;text-transform:uppercase;letter-spacing:.12em;cursor:pointer}.error{min-height:1.4em;margin-top:10px;color:#8a3131;font-size:.82rem}</style></head><body><main class="card"><div class="kicker">Private Access</div><h1>Vineyard Vista Properties</h1><p id="copy">Enter the website password to continue.</p><form id="form"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Continue</button><div class="error" id="error" aria-live="polite"></div></form></main><script>
const q=new URLSearchParams(location.search);const next=q.get('next')||'/';const area=q.get('area')||(next.includes('management')?'management':'site');if(area==='management')document.getElementById('copy').textContent='Enter the Management password to continue.';document.getElementById('form').addEventListener('submit',async(e)=>{e.preventDefault();const error=document.getElementById('error');error.textContent='';const password=document.getElementById('password').value;const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password,area,next})});if(r.ok){const data=await r.json();location.href=data.next||next;return}error.textContent='Incorrect password.'});
</script></body></html>
