<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Vineyard Vista Properties | Private Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Libre+Franklin:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="access-page">
  <main class="access-card">
    <div class="eyebrow" id="eyebrow">Private Access</div>
    <h1 id="access-title">Vineyard Vista Properties</h1>
    <p id="access-copy">This working website is currently available only to invited partners.</p>
    <form class="access-form" id="access-form">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required autofocus>
      <div class="show-row"><input type="checkbox" id="show-password"><label for="show-password">Show password</label></div>
      <button type="submit">Continue</button>
      <div id="error" class="access-error" aria-live="polite"></div>
    </form>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const area = params.get('area') === 'management' ? 'management' : 'site';
    const requestedNext = params.get('next') || (area === 'management' ? '/management' : '/');
    const safeNext = requestedNext.startsWith('/') && !requestedNext.startsWith('//') ? requestedNext : (area === 'management' ? '/management' : '/');

    const title = document.getElementById('access-title');
    const eyebrow = document.getElementById('eyebrow');
    const copy = document.getElementById('access-copy');
    if (area === 'management') {
      eyebrow.textContent = 'Partner Access';
      title.textContent = 'Management Portal';
      copy.textContent = 'Private operating information for Vineyard Vista partners and authorized property-management personnel.';
    } else {
      eyebrow.textContent = 'Private Partner Preview';
      title.textContent = 'Vineyard Vista Properties';
      copy.textContent = 'This working website is currently password protected while the concept and operating model are being developed with partners.';
    }

    const input = document.getElementById('password');
    const show = document.getElementById('show-password');
    show.addEventListener('change', () => {
      input.type = show.checked ? 'text' : 'password';
      input.focus();
    });

    document.getElementById('access-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const error = document.getElementById('error');
      error.textContent = '';
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ area, password: input.value })
        });
        if (response.ok) {
          location.href = safeNext;
          return;
        }
        const data = await response.json().catch(() => ({}));
        error.textContent = data.error || 'Incorrect password.';
        input.focus();
        input.select();
      } catch (e) {
        error.textContent = 'Unable to sign in. Please try again.';
      }
    });
  </script>
</body>
</html>
