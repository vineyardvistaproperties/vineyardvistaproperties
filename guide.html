<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0D2340" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Vineyard Vista Properties | Private Guest Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Libre+Franklin:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header" id="top">
    <div class="brand-row shell">
      <a class="brand" href="#top" aria-label="Vineyard Vista Properties home">
        <span class="brand-name" id="brand-name">Vineyard Vista</span>
        <span class="brand-sub" id="brand-sub">Properties</span>
      </a>
      <div class="header-actions">
        <a class="logout-link" href="/api/logout">Sign out</a>
        <button class="menu-toggle" aria-label="Open navigation" aria-expanded="false">Menu</button>
      </div>
      <nav class="site-nav" id="site-nav" aria-label="Primary navigation"></nav>
    </div>
  </header>

  <main id="guide-root" aria-live="polite">
    <section class="hero shell">
      <div class="hero-copy">
        <p class="kicker" id="hero-kicker"></p>
        <h1 id="hero-title"></h1>
        <p class="hero-text" id="hero-text"></p>
        <a class="text-link" id="hero-link" href="#house"></a>
      </div>
      <div class="hero-mark" aria-hidden="true"><img src="/vvp-logo.jpeg" alt="" /></div>
    </section>
    <div id="dynamic-sections"></div>
  </main>

  <footer>
    <div class="shell footer-inner">
      <div><div class="footer-brand" id="footer-brand"></div><div class="footer-tagline" id="footer-tagline"></div></div>
      <a href="#top">Back to top</a>
    </div>
  </footer>

  <script src="/script.js" defer></script>
</body>
</html>
